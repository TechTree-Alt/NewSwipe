name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Secrets에 키스토어가 있으면 그 키로 릴리스 APK에 서명한다.
      - name: Prepare signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NEWSWIPE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 웹에서 파일을 올리면 실행 권한이 빠질 수 있다.
      - run: chmod +x gradlew

      - name: Test and build
        env:
          NEWSWIPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEWSWIPE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEWSWIPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/NewSwipe-${GITHUB_REF_NAME//\//-}.apk"
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: NewSwipe-apk
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.apk
          generate_release_notes: true
