name: Build with translate patch

# 원본(TechTree-Alt/NewSwipe)의 소스를 그대로 가져와 translate.patch(번역 버튼)를 얹어 빌드한다.
# 이 저장소의 코드는 건드리지 않는다: 이 저장소에는 translate.patch와 이 파일만 있으면 된다.
# 원본이 업데이트되면 'Run workflow'를 누르거나 매주 월요일 자동 실행으로 새 APK를 만든다.
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '원본의 브랜치 또는 태그 (비우면 main)'
        required: false
        default: 'main'
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 09:00 (한국 시간)

permissions:
  contents: read

env:
  UPSTREAM_REPO: TechTree-Alt/NewSwipe

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      # 내 저장소: 패치 파일만 쓴다.
      - uses: actions/checkout@v7
        with:
          path: mine

      # 원본 소스. 3-way 병합을 위해 전체 기록을 받는다.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: src
          fetch-depth: 0

      - name: Apply translate patch
        working-directory: src
        run: |
          echo "원본 커밋: $(git rev-parse --short HEAD)"
          if git apply --3way --whitespace=nowarn ../mine/translate.patch; then
            echo "패치 적용 완료"
          else
            git reset -q --hard
            echo "::warning::3-way 적용 실패, 줄 위치 오차를 허용해 다시 시도합니다"
            if patch -p1 --no-backup-if-mismatch -F3 < ../mine/translate.patch && ! find . -name '*.rej' | grep -q .; then
              echo "패치 적용 완료 (오차 허용)"
            else
              echo "::error::원본이 바뀌어 translate.patch가 맞지 않습니다. 패치를 새 원본에 맞춰 고쳐야 합니다."
              find . -name '*.rej' -print
              exit 1
            fi
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NEWSWIPE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: src
        env:
          NEWSWIPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEWSWIPE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEWSWIPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        working-directory: src
        run: |
          mkdir -p ../out
          sha=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/release/app-release.apk "../out/NewSwipe-translate-$sha.apk"
          ls -la ../out

      - uses: actions/upload-artifact@v7
        with:
          name: NewSwipe-translate-apk
          path: out/*.apk
