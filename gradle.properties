org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# 이 앱은 AndroidX 라이브러리를 쓰지 않는다 (용량·메모리를 줄이기 위해 안드로이드 기본 API만 사용).
# 다만 UI 시험(Robolectric)이 시험할 때만 androidx.test를 끌어오므로 켜 둔다. 앱(APK·AAB)에는 들어가지 않는다.
android.useAndroidX=true
android.nonTransitiveRClass=true
# 자바만 쓰므로 AGP 9의 내장 Kotlin(그리고 Kotlin 표준 라이브러리 의존성)을 끈다.
android.builtInKotlin=false
